<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Crack Detection{% endblock %}</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{ url_for('main.index') }}">
        Crack Detection
      </a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <a class="nav-link text-white-50 small" href="{{ url_for('main.api_health') }}">
          Health
        </a>
        <span class="badge text-bg-secondary">DeepCrack &middot; U-Net</span>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="container py-4 text-body-secondary small border-top mt-4">
    <p class="mb-1">
      Trained on the DeepCrack dataset (Liu et al., <em>Neurocomputing</em> 338:139&ndash;153, 2019).
    </p>
    <p class="mb-0">
      Research and demonstration code. Not a substitute for a structural engineering inspection.
    </p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
