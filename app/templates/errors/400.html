{% extends "base.html" %}
{% block title %}Bad request{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card border-warning">
      <div class="card-body">
        <h1 class="h4 card-title">That request could not be processed</h1>
        <p class="text-body-secondary">{{ message }}</p>
        <a class="btn btn-primary btn-sm" href="{{ url_for('main.index') }}">Back to upload</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
